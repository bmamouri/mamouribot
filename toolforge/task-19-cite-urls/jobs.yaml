# وظیفهٔ ۱۹ — تکمیل یادکردهای نشانی عریان و اصلاح نشانی منبع‌ها.   see the ⚠️ below
#
# Approved by Huji, ۲۲ نوامبر ۲۰۲۶ ({{مجوز دارد}}). Everything below runs as MamouriBot.
#
# ⚠️ `toolforge jobs load` SYNCS — it deletes scheduled jobs absent from the file it is
# given, including every other task's jobs. Use `toolforge jobs run` / `delete` per job.
---
- name: cu-check
  command: ./task-19-cite-urls/run.sh --check
  image: node20
  mem: 512Mi
  emails: onfailure
  filelog-stdout: logs/cu-check.out
  filelog-stderr: logs/cu-check.err

# Dry run, no login, no writes. Read every diff before trusting a batch size.
- name: cu-dry
  command: ./task-19-cite-urls/run.sh --limit 50
  image: node20
  mem: 1Gi
  emails: onfailure
  filelog-stdout: logs/cu-dry.out
  filelog-stderr: logs/cu-dry.err

# The first live batch as MamouriBot, small: the trial was under my own account.
- name: cu-first
  command: ./task-19-cite-urls/run.sh --live --limit 50 --delay 15
  image: node20
  mem: 1Gi
  retry: 0
  emails: all
  filelog-stdout: logs/cu-first.out
  filelog-stderr: logs/cu-first.err

# Daily. 1,000 edits a run (the request said 150; raised ۲۳ نوامبر ۲۰۲۶, noted on the request
# page). Lookups and writes are interleaved by chunk; see docs/task-19-cite-urls.md.
# 05:40 UTC is clear of وظیفهٔ ۱ (06:20), ۱۵ (03:05), ۱۶ (06:50), ۱۲ (08:00, 09:30), ۲۰ (07:05).
- name: cu-daily
  command: env TARGET_CAP=4000 ./task-19-cite-urls/run.sh --live --limit 1000 --delay 15
  image: node20
  mem: 1Gi
  schedule: "40 5 * * *"
  retry: 0
  emails: onfailure
  filelog-stdout: logs/cu-daily.out
  filelog-stderr: logs/cu-daily.err
