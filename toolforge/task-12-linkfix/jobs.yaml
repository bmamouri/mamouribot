# وظیفهٔ ۱۲ — linkfix.   toolforge jobs load jobs.yaml
#
# The candidate selector is inside run.sh, deliberately: a job command crosses two shells
# and mangles Persian titles. See the comment there.
#
# `lf-trial` is the ۵۰-edit temporary permission granted on the request page on
# ۹ اکتبر ۲۰۲۶. Do NOT create `lf-full` until the permanent permission is issued.
---
- name: lf-check
  command: ./task-12-linkfix/run.sh --check
  image: node20
  mem: 512Mi
  emails: onfailure
  filelog-stdout: logs/lf-check.out
  filelog-stderr: logs/lf-check.err

- name: lf-dry
  command: ./task-12-linkfix/run.sh
  image: node20
  mem: 1Gi
  emails: onfailure
  filelog-stdout: logs/lf-dry.out
  filelog-stderr: logs/lf-dry.err

- name: lf-trial
  command: ./task-12-linkfix/run.sh --live --limit 50 --delay 15
  image: node20
  mem: 1Gi
  retry: 0          # never silently re-run a partial edit batch
  emails: all
  filelog-stdout: logs/lf-trial.out
  filelog-stderr: logs/lf-trial.err

- name: lf-daily
  command: ./task-12-linkfix/run.sh --live --limit 100 --delay 15
  image: node20
  mem: 2Gi
  schedule: "0 8 * * *"
  retry: 0
  emails: onfailure
  filelog-stdout: logs/lf-daily.out
  filelog-stderr: logs/lf-daily.err

# The ranked infobox list (task-20 census): articles whose infobox has English links to
# subjects that have an fa article. Same task and scope as lf-daily; a different selector.
# 09:30 UTC, after lf-daily (08:00) has finished.
- name: lf-ib-daily
  command: env TARGET_CAP=400 ./task-12-linkfix/run-infobox.sh --live --limit 150 --delay 15
  image: node20
  mem: 2Gi
  schedule: "30 9 * * *"
  retry: 0
  emails: onfailure
  filelog-stdout: logs/lf-ib-daily.out
  filelog-stderr: logs/lf-ib-daily.err
