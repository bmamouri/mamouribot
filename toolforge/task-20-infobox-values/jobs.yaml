# وظیفهٔ ۲۰: English values left in infoboxes and navboxes. Approved by Huji ۲۳ نوامبر ۲۰۲۶
# after a 100-edit trial under the operator's account.
#
# ⚠️ Never `toolforge jobs load` this file: it deletes every other task's scheduled jobs.
# Create each job with `toolforge jobs run`, copying the fields (bots/docs/TOOLFORGE.md §5).
---
# Read-only census of the newest complete fawiki dump. Writes
# ~/task-20-infobox-values/census/<dump date>/. About 6 minutes with 3 workers.
- name: t20-census
  command: ./task-20-infobox-values/census.sh
  image: python3.13
  cpu: 3
  mem: 4Gi
  retry: 0
  emails: onfailure
  filelog-stdout: logs/t20-census.out
  filelog-stderr: logs/t20-census.err

# Read-only census of navbox and sidebar templates in the same dump, plus how many
# articles call each one. Writes nav-* files beside the infobox census.
- name: t20-nav-census
  command: ./task-20-infobox-values/navbox-census.sh
  image: python3.13
  cpu: 3
  mem: 4Gi
  retry: 0
  emails: onfailure
  filelog-stdout: logs/t20-nav-census.out
  filelog-stderr: logs/t20-nav-census.err

# Check credentials, bot flag and stop page. No edits.
- name: t20-check
  command: ./task-20-infobox-values/run.sh --check
  image: node20
  mem: 512Mi
  retry: 0
  emails: onfailure
  filelog-stdout: logs/t20-check.out
  filelog-stderr: logs/t20-check.err

# First live batch as MamouriBot. One-off.
- name: t20-first
  command: ./task-20-infobox-values/run.sh --live --limit 30 --delay 15
  image: node20
  mem: 1Gi
  retry: 0
  emails: all
  filelog-stdout: logs/t20-first.out
  filelog-stderr: logs/t20-first.err

# At most 1,000 edits a day (about 4–5 hours at 15 s). Daily until the target file is worked through, then weekly with a fresh
# census. 07:05 UTC is clear of tasks 1 (06:20), 16 (06:50), 7/9/8 (07:15–07:45) and 12 (08:00).
- name: t20-daily
  command: ./task-20-infobox-values/run.sh --live --limit 1000 --delay 15
  image: node20
  mem: 1Gi
  schedule: "5 7 * * *"
  retry: 0
  emails: onfailure
  filelog-stdout: logs/t20-daily.out
  filelog-stderr: logs/t20-daily.err

# Dry run over the current target file. No login, no writes.
- name: t20-dry
  command: ./task-20-infobox-values/run.sh --limit 200
  image: node20
  mem: 1Gi
  retry: 0
  emails: onfailure
  filelog-stdout: logs/t20-dry.out
  filelog-stderr: logs/t20-dry.err
